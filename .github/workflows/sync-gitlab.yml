name: Sync from GitLab

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: 

# Grant the workflow write permissions to the repository contents
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull from GitLab and Push to GitHub
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # Add GitLab as upstream
          git remote add upstream https://gitlab.com/vita-linux/vita-generic-mirrorlists.git
          git fetch upstream
          
          # Merge and push
          git checkout main
          git merge upstream/main --allow-unrelated-histories -m "Sync: Merge upstream GitLab changes"
          git push origin main
